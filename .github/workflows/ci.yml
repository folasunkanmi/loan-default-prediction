name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app,api]"
      - name: Generate small synthetic smoke data
        run: |
          python -c "from src.data.generate_data import generate_loan_dataset; generate_loan_dataset(n_samples=2000, seed=42, save_path='data/raw/loan_data.csv')"
      - name: Lint
        run: ruff check src tests api app
      - name: Test
        run: pytest tests/ -v --tb=short
