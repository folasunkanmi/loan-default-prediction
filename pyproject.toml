[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-default-prediction"
version = "1.2.2"
description = "Production-oriented loan default prediction and credit risk intelligence system."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Folasunkanmi"}]
keywords = [
    "credit-risk", "loan-default", "machine-learning", "lending-club",
    "shap", "fintech", "probability-of-default", "fastapi", "calibration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.6.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "imbalanced-learn>=0.11.0",
    "shap>=0.44.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "joblib>=1.3.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.28.0", "plotly>=5.18.0"]
api = ["fastapi>=0.110.0", "uvicorn[standard]>=0.27.0", "httpx>=0.27.0"]
dev = ["pytest>=7.4.0", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/folasunkanmi/loan-default-prediction"
Repository = "https://github.com/folasunkanmi/loan-default-prediction"
Issues = "https://github.com/folasunkanmi/loan-default-prediction/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Style / modernisation rules deferred; CI should catch correctness issues.
# Revisit F401 unused imports in a dedicated cleanup PR.
select = ["E", "F", "W"]
ignore = ["E501", "E402", "F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
